[project]
name = "market-regime"
version = "0.1.0"
description = "Growth–inflation regime labeling and asset returns by All Weather box"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["market_regime"]
