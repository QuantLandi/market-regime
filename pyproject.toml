[project]
name = "market-regime"
version = "0.1.0"
description = "All Weather asset proxies and first-print growth/inflation regimes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=2.2",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
bloomberg = ["blpapi"]

[[tool.uv.index]]
name = "bloomberg"
url = "https://blpapi.bloomberg.com/repository/releases/python/simple/"
explicit = true

[tool.uv.sources]
blpapi = { index = "bloomberg" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["market_regime", "backtest"]
